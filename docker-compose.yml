services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-intel-backend
    ports:
      - "3001:3001"
    volumes:
      # Mount server directory to persist the SQLite threat database across restarts
      - ./server:/app/server
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
